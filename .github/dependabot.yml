# Central Package Management: versions live in Directory.Packages.props at repo root.
# Play'Up web: src/PlayUp/web/package.json
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Group order matters: first matching group wins. Put specific groups before catch-alls.

version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
    labels:
      - dependencies
      - nuget
      - backend
    groups:
      analyzers:
        patterns:
          - "StyleCop.*"
          - "Roslynator.*"
          - "Microsoft.CodeAnalysis.NetAnalyzers"
      # EF Core and Npgsql EF must stay on the same train (see Directory.Packages.props).
      ef-core-train:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql.EntityFrameworkCore.PostgreSQL"
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      microsoft-aspnet:
        patterns:
          - "Microsoft.AspNetCore.*"
      microsoft-build-tooling:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "Microsoft.SourceLink.*"
      test-stack:
        patterns:
          - "xunit*"
          - "FluentAssertions"
          - "Moq"
          - "AutoFixture*"
          - "coverlet.*"
          - "GitHubActionsTestLogger"
      serilog:
        patterns:
          - "Serilog.*"
      testcontainers:
        patterns:
          - "Testcontainers.*"

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - dotnet-sdk
      - backend

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /src/PlayUp/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 4
    labels:
      - dependencies
      - npm
      - frontend
    groups:
      react-runtime:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "react-router-dom"
          - "react-i18next"
      app-libraries:
        patterns:
          - "@tanstack/*"
          - "i18next"
          - "lucide-react"
          - "@fontsource/*"
      vite-toolchain:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
          - "typescript"
          - "@types/node"
      testing:
        patterns:
          - "@playwright/*"
          - "@testing-library/*"
          - "jsdom"
      lint-and-format:
        patterns:
          - "oxlint"
          - "prettier"
          - "stylelint*"
      # Any new dependency not listed above still lands in one weekly PR per type.
      npm-production:
        dependency-type: production
        patterns:
          - "*"
      npm-development:
        dependency-type: development
        patterns:
          - "*"
