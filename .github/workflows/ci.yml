name: "Play'Up — CI"

on:
  push:
    branches: [ "main", "feature/*", "bugfix/*", "fix/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: .NET — Build and tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            11.0.100-rc.1.26425.128
            11.0.100-rc.2.26504.105

      - name: Restore
        run: bash .github/scripts/restore-with-diagnostics.sh MyClub.slnx

      - name: Upload restore diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: restore-diagnostic-${{ github.job }}
          path: ${{ runner.temp }}/myclub-restore-diag/
          retention-days: 7

      - name: NuGet vulnerable packages
        run: dotnet list MyClub.slnx package --vulnerable --include-transitive

      - name: Build
        run: dotnet build MyClub.slnx --no-restore --configuration Release 2>&1 | tee "${RUNNER_TEMP}/dotnet-build.log"

      - name: Verify .NET warnings baseline
        run: bash .github/scripts/verify-dotnet-warnings-baseline.sh "${RUNNER_TEMP}/dotnet-build.log"

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "GitHubActions" --verbosity normal
        
      - name: Publish Host (architecture isolation)
        run: |
          dotnet publish src/PlayUp/MyClub.PlayUp.Host/MyClub.PlayUp.Host.csproj --no-build --configuration Release --output "${RUNNER_TEMP}/playup-host-publish"
          if [ -f "${RUNNER_TEMP}/playup-host-publish/MyClub.PlayUp.Development.dll" ]; then
            echo "MyClub.PlayUp.Development.dll must not be published with Host" >&2
            exit 1
          fi
          if [ -f "${RUNNER_TEMP}/playup-host-publish/MyClub.PlayUp.DevRunner.dll" ]; then
            echo "MyClub.PlayUp.DevRunner.dll must not be published with Host" >&2
            exit 1
          fi
          if [ -f "${RUNNER_TEMP}/playup-host-publish/MyClub.PlayUp.TestKit.dll" ]; then
            echo "MyClub.PlayUp.TestKit.dll must not be published with Host" >&2
            exit 1
          fi

  web:
    name: Web — Quality and unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
      checks: write
    defaults:
      run:
        working-directory: src/PlayUp/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/PlayUp/web/package-lock.json

      - name: Install
        run: npm ci

      - name: npm production audit
        run: npm audit --omit=dev

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Lint CSS (design-system)
        run: npm run lint:css

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (stub API)
        run: npx playwright test
        env:
          CI: true

  e2e-integration:
    name: E2E — Host and PostgreSQL
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
      checks: write
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myclub_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            11.0.100-rc.1.26425.128
            11.0.100-rc.2.26504.105

      - name: Restore
        run: bash .github/scripts/restore-with-diagnostics.sh MyClub.slnx

      - name: Upload restore diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: restore-diagnostic-${{ github.job }}
          path: ${{ runner.temp }}/myclub-restore-diag/
          retention-days: 7

      - name: Build .NET (Release)
        run: dotnet build MyClub.slnx --no-restore --configuration Release

      - name: Seed Host E2E scenarios
        env:
          ConnectionStrings__PlayUpDev: "Host=localhost;Port=5432;Database=myclub_dev;Username=postgres;Password=postgres"
        run: >
          dotnet run --project src/PlayUp/MyClub.PlayUp.DevRunner
          --configuration Release --no-build
          -- --reset --scenarios championship-ready,cup-composition-complete,structure-materialize-recette

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/PlayUp/web/package-lock.json

      - name: Install web dependencies
        working-directory: src/PlayUp/web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: src/PlayUp/web
        run: npx playwright install --with-deps chromium

      - name: E2E business (Host + PostgreSQL)
        working-directory: src/PlayUp/web
        run: |
          export Media__StorageRoot="${RUNNER_TEMP}/playup-e2e-media"
          mkdir -p "${Media__StorageRoot}"
          dotnet run --project ../MyClub.PlayUp.Host/MyClub.PlayUp.Host.csproj \
            --configuration Release --no-build \
            --urls http://127.0.0.1:5287 &
          HOST_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5287/health > /dev/null; then
              echo "Host ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Host failed to become ready" >&2
              kill "$HOST_PID" 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done
          npx playwright test -c playwright.host.config.ts
          kill "$HOST_PID" 2>/dev/null || true
        env:
          CI: true
          VITE_API_PROXY_TARGET: http://127.0.0.1:5287
          ConnectionStrings__PlayUp: "Host=localhost;Port=5432;Database=myclub_dev;Username=postgres;Password=postgres"
          ConnectionStrings__Media: "Host=localhost;Port=5432;Database=myclub_dev;Username=postgres;Password=postgres"
