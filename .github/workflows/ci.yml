name: CI - Build and Test

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Publish Host (architecture isolation)
        run: |
          dotnet publish src/PlayUp/MyClub.PlayUp.Host/MyClub.PlayUp.Host.csproj --no-build --configuration Release --output "${RUNNER_TEMP}/playup-host-publish"
          if [ -f "${RUNNER_TEMP}/playup-host-publish/MyClub.PlayUp.Development.dll" ]; then
            echo "MyClub.PlayUp.Development.dll must not be published with Host" >&2
            exit 1
          fi
          if [ -f "${RUNNER_TEMP}/playup-host-publish/MyClub.PlayUp.DevRunner.dll" ]; then
            echo "MyClub.PlayUp.DevRunner.dll must not be published with Host" >&2
            exit 1
          fi
          if [ -f "${RUNNER_TEMP}/playup-host-publish/MyClub.PlayUp.TestKit.dll" ]; then
            echo "MyClub.PlayUp.TestKit.dll must not be published with Host" >&2
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/PlayUp/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/PlayUp/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Lint CSS (design-system)
        run: npm run lint:css

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npx playwright test
        env:
          CI: true
