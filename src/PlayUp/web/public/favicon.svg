<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    Play'Up app mark. Flat brand fill, not the gradient: the favicon renders at
    16-32px, where the decision calls for the flat treatment. Rounded square
    cartouche - never a shield, so the product never reads as one more club.
  -->
  <defs>
    <mask id="playup-favicon" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect x="0" y="0" width="100" height="100" fill="#fff"/>
      <g transform="translate(14 14) scale(.72) translate(8 0) skewX(-9)"
         stroke="#000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M52 55 L74 27"/>
        <path d="M56 27 L74 27 L74 45"/>
      </g>
    </mask>
  </defs>
  <rect x="0" y="0" width="100" height="100" rx="23" fill="#1c67c4"/>
  <g mask="url(#playup-favicon)">
    <g transform="translate(14 14) scale(.72) translate(8 0) skewX(-9)">
      <path d="M20 94 V6 H55 A31 31 0 0 1 55 68 H43 V94 Z" fill="#fff"/>
    </g>
  </g>
</svg>
